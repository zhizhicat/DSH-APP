# Builds the arm64 release APK on every push to main and manual dispatch.
# Reuses the project's own toolchain script (TUNA / flutter-io.cn mirrors),
# then tooling/build-apk.sh, which runs the runtime preflight and tawcroot
# build itself. APK lands in the run's artifacts as dsh-app-arm64-apk.
name: APK build

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apk.yml', 'app/**', 'packages/**', 'runtime/**', 'tooling/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  apk:
    name: arm64 release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned upstream)
        with:
          persist-credentials: false

      - name: Install toolchain (JDK 17 / Android SDK+NDK; Flutter via flutter-action)
        run: bash tooling/setup-toolchain.sh

      - name: Set up Flutter (pinned, mirrors upstream CI)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 (pinned upstream)
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Export toolchain env
        run: |
          bash tooling/setup-toolchain.sh >/dev/null 2>&1 || true
          JAVA_HOME=$(grep -o 'JAVA_HOME="[^"]*"' tooling/env.sh | cut -d'"' -f2)
          SDK=$(grep -o 'ANDROID_HOME="[^"]*"' tooling/env.sh | cut -d'"' -f2)
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # 注意：不导出 env.sh 里的 PUB_HOSTED_URL/FLUTTER_STORAGE_BASE_URL——
          # 国内镜像与 pub.dev 不同步，--enforce-lockfile 会因版本差而失败（首次构建已踩坑）

      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      # build-runtime.sh 依赖的 termux 官方池已轮换掉 pin 的 proot deb（全镜像 404，
      # 上游 CI 不构建运行时所以未暴露）。改用官方 release APK 里的运行时资产：
      # 它本就由同一套 build-runtime.sh 产出、带 manifest+sha256，check_runtime_bundle 会全量校验。
      # tawcroot/build.py 强制要求 NDK 28.2.13676358（tawc source.json pin），
      # setup-toolchain 只装 Flutter 默认 NDK，这里补装
      - name: Install NDK pinned by tawcroot
        run: yes | sdkmanager --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358" >/dev/null || sdkmanager --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"

      - name: Restore bundled runtime from upstream release (pinned)
        run: |
          set -euo pipefail
          mkdir -p runtime/.cache/release
          cd runtime/.cache/release
          curl -sL -o dsh-go.apk "https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.0.15/dsh-go-1.0.15-arm64.apk"
          curl -sL -o SHA256SUMS "https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.0.15/SHA256SUMS"
          sha256sum -c SHA256SUMS
          unzip -o -q dsh-go.apk 'assets/runtime/*' -d extracted
          mkdir -p ../../out/arm64-v8a/assets
          rm -rf ../../out/arm64-v8a/assets/runtime
          mv extracted/assets/runtime ../../out/arm64-v8a/assets/
          for so in libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so; do
            unzip -o -q -j dsh-go.apk "lib/arm64-v8a/$so" -d ../../out/arm64-v8a/jniLibs/arm64-v8a/
          done
          ls -lh ../../out/arm64-v8a/assets/runtime/ ../../out/arm64-v8a/jniLibs/arm64-v8a/

      - name: Build arm64 release APK
        run: bash tooling/build-apk.sh

      - name: Show build outputs
        run: |
          ls -lh app/build/app/outputs/flutter-apk/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-app-arm64-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
