# Builds the arm64 release APK on every push to main and manual dispatch.
# Default (push, and dispatch with runtime=none) ships WITHOUT bundled runtime:
# the APK downloads rootfs/Node on first run (档二). Dispatch with runtime=full
# reproduces the upstream-equivalent complete package (fallback / regression
# baseline). Reuses the project's own toolchain script, then tooling/build-apk.sh.
name: APK build

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apk.yml', 'app/**', 'packages/**', 'runtime/**', 'tooling/**']
  workflow_dispatch:
    inputs:
      runtime:
        description: 'Bundle runtime into the APK?'
        type: choice
        options: [none, full]
        default: none

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  RUNTIME_MODE: ${{ github.event.inputs.runtime || 'none' }}

jobs:
  apk:
    name: arm64 release APK (${{ github.event.inputs.runtime || 'none' }} runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned upstream)
        with:
          persist-credentials: false

      - name: Install toolchain (JDK 17 / Android SDK+NDK; Flutter via flutter-action)
        run: bash tooling/setup-toolchain.sh

      - name: Set up Flutter (pinned, mirrors upstream CI)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 (pinned upstream)
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Export toolchain env
        run: |
          bash tooling/setup-toolchain.sh >/dev/null 2>&1 || true
          JAVA_HOME=$(grep -o 'JAVA_HOME="[^"]*"' tooling/env.sh | cut -d'"' -f2)
          SDK=$(grep -o 'ANDROID_HOME="[^"]*"' tooling/env.sh | cut -d'"' -f2)
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # runner 镜像预置 ANDROID_NDK_HOME 指向旧版 NDK，会盖过 setup-toolchain 装的
          # r28c；tawcroot/build.py 优先读它，这里显式钉到 pinned 版本
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # 注意：不导出 env.sh 里的 PUB_HOSTED_URL/FLUTTER_STORAGE_BASE_URL——
          # 国内镜像与 pub.dev 不同步，--enforce-lockfile 会因版本差而失败（首次构建已踩坑）

      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      # tawcroot/build.py 精确找 <SDK>/ndk/28.2.13676358；setup-toolchain 通常已装 r28c，
      # 此步幂等兜底（用完整路径，不依赖 env.sh 的 PATH）
      - name: Ensure NDK 28.2.13676358 present
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358" >/dev/null || true

      # Container-layer restore (always needed): proot 四件套 jniLibs from the
      # official release. build-runtime.sh 依赖的 termux 官方池已轮换掉 pin 的
      # proot deb（全镜像 404），所以容器二进制从官方 APK 1:1 还原。
      # runtime=full additionally restores assets/runtime/*（完整包回退基线）。
      - name: Restore container libs (and runtime when mode=full)
        run: |
          set -euo pipefail
          mkdir -p runtime/.cache/release
          cd runtime/.cache/release
          curl -fSL --retry 3 -o dsh-go-1.0.15-arm64.apk "https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.0.15/dsh-go-1.0.15-arm64.apk"
          test -s dsh-go-1.0.15-arm64.apk
          curl -fSL --retry 3 -o SHA256SUMS "https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.0.15/SHA256SUMS"
          sha256sum -c SHA256SUMS
          mkdir -p ../../out/arm64-v8a/jniLibs/arm64-v8a
          for so in libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so; do
            unzip -o -q -j dsh-go-1.0.15-arm64.apk "lib/arm64-v8a/$so" -d ../../out/arm64-v8a/jniLibs/arm64-v8a/
          done
          if [ "$RUNTIME_MODE" = full ]; then
            unzip -o -q dsh-go-1.0.15-arm64.apk 'assets/runtime/*' -d extracted
            mkdir -p ../../out/arm64-v8a/assets
            rm -rf ../../out/arm64-v8a/assets/runtime
            mv extracted/assets/runtime ../../out/arm64-v8a/assets/
          fi
          ls -lh ../../out/arm64-v8a/jniLibs/arm64-v8a/

      - name: Build arm64 release APK
        run: |
          if [ "$RUNTIME_MODE" = full ]; then
            bash tooling/build-apk.sh
          else
            bash tooling/build-apk.sh --noruntime
          fi

      - name: Show build outputs
        run: |
          ls -lh app/build/app/outputs/flutter-apk/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-app-arm64-${{ env.RUNTIME_MODE }}-runtime-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
