# Runtime layers release: 4 base rootfs × 3 Node × DSH → runtime-layers release.
# Hand-triggered (workflow_dispatch): the layers build is heavy (xz compressing four
# rootfs), and every published index changes what the app offers on first-run setup.
# The app reads layers-index.json from this release (channels.json dsh-go-layers).
name: Runtime layers release

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'base:node pairs (base = ubuntu-<ver> | debian-<major>)'
        default: 'ubuntu-24.04.5:24.9.0 debian-12:24.22.1 debian-13:26.13.1 ubuntu-26.04.1:24.9.0'
      dsh_version:
        description: 'DSH version (empty = npm upstream latest)'
        default: ''

permissions:
  contents: write

jobs:
  layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Big blobs (rootfs tarballs, node dists, debs, npm prefixes) dominate the
      # build time; the cache carries them across runs. Cache hits still re-verify
      # every sha256 (fetch() does), so a poisoned cache cannot change outputs.
      - name: Restore build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: runtime/.cache
          key: runtime-layers-v1-arm64-${{ hashFiles('runtime/build-runtime.sh', 'runtime/build-layers.sh', 'runtime/locks/**', 'runtime/lib/rtbuild.py') }}
          restore-keys: runtime-layers-v1-arm64-

      - name: Build the layers
        run: |
          set -euo pipefail
          RUNTIME_VARIANTS="${{ github.event.inputs.variants }}" \
          DSH_VERSION="${{ github.event.inputs.dsh_version }}" \
          RUNTIME_OUT="$PWD/runtime/out" \
          bash runtime/build-layers.sh

      - name: List the layers
        run: |
          ls -lh runtime/out/layers-index.json runtime/out/arm64-v8a/assets/runtime/

      - name: Upload build artifact (audit copy)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-layers-build
          path: |
            runtime/out/layers-index.json
            runtime/out/arm64-v8a/assets/runtime/
          if-no-files-found: error

      - name: Publish to the runtime-layers release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(runtime/out/layers-index.json runtime/out/arm64-v8a/assets/runtime/*.tar.xz)
          if gh release view runtime-layers >/dev/null 2>&1; then
            gh release upload runtime-layers "${files[@]}" --clobber
          else
            gh release create runtime-layers "${files[@]}" \
              --title "Runtime layers" \
              --notes "Layer archives for the variant setup page (base / node / DSH). See layers-index.json."
          fi
          gh release view runtime-layers --json assets --jq '.assets[].name'
