name: Record pins

# Manual helper: installs the pinned DSH lock, runs patch-dsh --record, and
# uploads the recorded pins.json as an artifact. Used when the shipped pins
# fall behind the pinned DSH version (a CI "no pin / broken chain" failure)
# and local npm access is unavailable.
on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH version to record (empty = newest pinned lock)'
        required: false
        default: ''

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record pins for the pinned DSH lock
        run: |
          version="${{ inputs.dsh_version }}"
          if [ -z "$version" ]; then
            version=$(sed -nE 's/^DSH_VERSION="\$\{DSH_VERSION:-(.+)\}"$/\1/p' runtime/build-runtime.sh)
          fi
          if [ -z "$version" ] || [ ! -f "runtime/locks/dsh-$version/package-lock.json" ]; then
            version=$(ls runtime/locks | sed -nE 's/^dsh-(.+)$/\1/p' | sort -V | tail -1)
          fi
          echo "Recording pins for DSH $version"
          prefix="$RUNNER_TEMP/dsh"
          mkdir "$prefix"
          cp "runtime/locks/dsh-$version/package.json" "runtime/locks/dsh-$version/package-lock.json" "$prefix/"
          npm ci --prefix "$prefix" --ignore-scripts --no-audit --no-fund
          python3 -I runtime/lib/rtbuild.py patch-dsh --prefix "$prefix" --dsh-version "$version" --target android --record || record_failed=1
          mkdir -p "$RUNNER_TEMP/drift-files"
          i=0
          for f in dsh-client-ui-input-trigger/lib/client.js dsh-client-ui-agent-preset/lib/client.js dsh-client-ui-settings-web-search/lib/client.js dsh-host-webserver/lib/index.js rrule/dist/es5/rrule.js dsh-fs-local/lib/index.js; do
            src="$prefix/node_modules/@deepseek-ai/$f"
            i=$((i+1))
            if [ -f "$src" ]; then
              case "$f" in
                */lib/client.js) kind=client ;;
                */lib/index.js)  kind=index  ;;
                *)               kind=misc   ;;
              esac
              pkg=$(basename "$(dirname "$(dirname "$f")")")
              cp "$src" "$RUNNER_TEMP/drift-files/${pkg}__${kind}.js"
            fi
          done
      - name: Upload recorded pins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorded-pins
          path: runtime/patches/pins.json
      - name: Pack drift files
        if: always()
        run: cd "$RUNNER_TEMP" && tar czf drift.tar.gz drift-files
      - name: Upload drift files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-files
          path: ${{ runner.temp }}/drift.tar.gz
